<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pokopia Planner</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- TOP / BOTTOM NAV TABS -->
<div class="top-tabs">
  <button class="tab-btn active" data-tab="pokemon" onclick="switchTab('pokemon')">🎮 <span>Pokémon</span></button>
  <button class="tab-btn" data-tab="habitats" onclick="switchTab('habitats')">🏡 <span>Habitats</span></button>
  <button class="tab-btn" data-tab="areas" onclick="switchTab('areas')">🗺️ <span>Areas</span></button>
  <button class="tab-btn disabled" title="Coming soon">📦 <span>Items</span></button>
  <button class="tab-btn disabled" title="Coming soon">📜 <span>Recipes</span></button>
  <button class="tab-btn disabled" title="Coming soon">🏗️ <span>Build</span></button>
  <button class="tab-btn disabled" title="Coming soon">🏺 <span>Collect</span></button>
  <div class="tab-spacer"></div>
  <div class="theme-picker-wrap" id="theme-picker-wrap">
    <button class="theme-picker-btn" onclick="toggleThemePicker()" title="Choose theme">🎨 Theme</button>
    <div class="theme-picker-popup" id="theme-picker-popup"></div>
  </div>
</div>

<!-- POKEMON TAB -->
<div id="tab-pokemon">
  <div class="controls-bar" id="ctrl-pokemon">
    <input type="text" id="pk-search" placeholder="Search Pokémon…" oninput="renderPokemon()">
    <div class="ctrl-divider"></div>
    <div class="ctrl-group">
      <span class="ctrl-label">Sort:</span>
      <button class="sort-btn active" id="sort-id" onclick="setSort('id')">ID</button>
      <button class="sort-btn" id="sort-name" onclick="setSort('name')">Name</button>
    </div>
    <div class="ctrl-divider"></div>
    <span class="ctrl-label">Filter:</span>
    <button class="spec-collapse-btn" id="spec-toggle-btn" onclick="toggleSpecCollapse()">Specialty ▾</button>
    <div class="ctrl-divider"></div>
      <button class="sort-btn " id="status-filter-button" onclick="toggleStatusFilter(this)">Hide Registered</button>
    <div class="ctrl-divider"></div>
    <div class="ctrl-spacer"></div>
    <button class="qa-toggle" onclick="toggleQuickAdd()" id="qa-toggle-btn">⚡ Quick Add</button>
  </div>
  <div id="spec-filters" class="spec-pills-wrap collapsed"></div>
  <div class="quick-add-bar hidden" id="quick-add-bar">
    <div class="qa-label"><span class="qa-dot"></span>Quick Add:</div>
    <button class="qa-area-btn wild-btn" id="qa-wild" onclick="setQAArea('wild')">🌿 Wild</button>
    <button class="qa-area-btn" id="qa-ww" onclick="setQAArea('Withered Wastelands')">🏜️ Withered</button>
    <button class="qa-area-btn" id="qa-bb" onclick="setQAArea('Bleak Beach')">🏖️ Beach</button>
    <button class="qa-area-btn" id="qa-rr" onclick="setQAArea('Rocky Ridges')">⛰️ Ridges</button>
    <button class="qa-area-btn" id="qa-ss" onclick="setQAArea('Sparkling Skylands')">☁️ Skylands</button>
    <button class="qa-area-btn" id="qa-pt" onclick="setQAArea('Palette Town')">🏘️ Palette</button>
    <button class="qa-trash-btn" onclick="confirmReturnAllToWild()" title="Return all to wild">🗑️ Return All</button>
  </div>
  <div class="main-content">
    <div class="card-grid" id="pokemon-grid"></div>
  </div>
</div>

<!-- HABITATS TAB -->
<div id="tab-habitats" style="display:none">
  <div class="controls-bar" id="ctrl-habitats">
    <input type="text" id="hab-search" placeholder="Search habitats…" oninput="renderHabitats()">
    <div class="ctrl-divider"></div>
    <div class="ctrl-group">
      <span class="ctrl-label">Sort:</span>
      <button class="sort-btn active" id="hab-sort-id" onclick="setHabSort('id')">ID</button>
      <button class="sort-btn" id="hab-sort-name" onclick="setHabSort('name')">Name</button>
    </div>
    <div class="ctrl-spacer"></div>
  </div>
  <div class="main-content">
    <div class="card-grid" id="habitats-grid"></div>
  </div>
</div>

<!-- AREAS TAB -->
<div id="tab-areas" style="display:none">
  <div class="controls-bar" id="ctrl-areas">
    <input type="text" id="area-search" placeholder="Search Pokémon in areas…" oninput="renderAreas()">
    <div class="ctrl-spacer"></div>
  </div>
  <div class="areas-container" id="areas-container"></div>
</div>

<!-- POKEMON MODAL -->
<div class="modal-overlay" id="pk-modal" onclick="closePkModal(event)">
  <div class="modal" id="pk-modal-inner"></div>
</div>

<!-- HABITAT MODAL -->
<div class="modal-overlay" id="hab-modal" onclick="closeHabModal(event)">
  <div class="modal" id="hab-modal-inner"></div>
</div>

<!-- CONFIRM DIALOG -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <p id="confirm-msg"></p>
    <div class="confirm-btns">
      <button class="confirm-btn cancel" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-btn danger" id="confirm-ok-btn">Confirm</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="pokopia-pokemon.js"></script>
<script src="pokopia-habitats.js"></script>
<script src="script.js"></script>

</body>
</html>
